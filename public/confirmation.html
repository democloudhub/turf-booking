<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Confirmation — Turf Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-turf">
    <div class="container">
      <a class="navbar-brand display-font" href="/" data-venue-name>GreenField Turf</a>
      <div class="d-flex gap-3 align-items-center" data-auth-nav></div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width:640px">
      <div id="alertBox"></div>
      <div class="confirm-card" id="confirmCard" hidden>
        <div class="mb-3">
          <span class="status-block status-block-lg confirmed" id="bookingStatus">Confirmed</span>
        </div>
        <h1 class="section-title mb-1" id="bookingId">—</h1>
        <p class="text-muted mb-3" id="confirmHint">Show this QR code at the venue for check-in.</p>
        <div id="qrWrap">
          <img class="qr" id="qrImage" alt="Booking QR code">
        </div>
        <div class="text-start mt-3 mb-4">
          <p class="mb-1"><strong>Name:</strong> <span id="cName"></span></p>
          <p class="mb-1"><strong>Date:</strong> <span id="cDate"></span></p>
          <p class="mb-1"><strong>Slot:</strong> <span id="cSlot"></span></p>
          <p class="mb-1"><strong>Amount:</strong> <span id="cAmount"></span></p>
          <p class="mb-0"><strong>Mobile:</strong> <span id="cMobile"></span></p>
        </div>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a class="btn btn-turf" id="pdfBtn" href="#">Download PDF Receipt</a>
          <a class="btn btn-outline-success" href="/">Back</a>
        </div>
        <p class="small text-muted mt-3 mb-0" id="notifyStatus"></p>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/confirmation.js"></script>
</body>
</html>
