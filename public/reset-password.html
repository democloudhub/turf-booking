<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Turf Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-turf">
    <div class="container">
      <a class="navbar-brand display-font" href="/" data-venue-name>GreenField Turf</a>
      <div class="d-flex gap-3 align-items-center" data-auth-nav></div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width:480px">
      <h1 class="section-title">Set / reset password</h1>
      <div id="alertBox"></div>

      <form id="forgotForm" class="form-panel" hidden>
        <p class="text-muted">Enter your account email and we’ll send a reset link.</p>
        <div class="mb-3">
          <label class="form-label" for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" class="form-control" required>
        </div>
        <button class="btn btn-turf w-100" type="submit">Send reset link</button>
        <p class="small mt-3 mb-0"><a href="/login">Back to login</a></p>
      </form>

      <form id="resetForm" class="form-panel" hidden>
        <p class="text-muted">Choose a new password for your account.</p>
        <div class="mb-3">
          <label class="form-label" for="newPassword">New password</label>
          <input type="password" id="newPassword" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" class="form-control" required minlength="6">
        </div>
        <button class="btn btn-turf w-100" type="submit">Save password</button>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
