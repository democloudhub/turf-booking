<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Turf Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-turf">
    <div class="container">
      <a class="navbar-brand display-font" href="/" data-venue-name>GreenField Turf</a>
      <div class="d-flex gap-3 align-items-center" data-auth-nav></div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width:480px">
      <h1 class="section-title">Sign in to book</h1>

      <div id="alertBox"></div>

      <ul class="nav nav-pills mb-3 gap-2">
        <li class="nav-item"><button class="nav-link active" type="button" data-mode="login">Login</button></li>
        <li class="nav-item"><button class="nav-link" type="button" data-mode="register">Register</button></li>
      </ul>

      <form id="loginForm" class="form-panel">
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" required minlength="6">
        </div>
        <button class="btn btn-turf w-100" type="submit">Login</button>
      </form>

      <form id="registerForm" class="form-panel" hidden>
        <div class="mb-3">
          <label class="form-label" for="regName">Full name</label>
          <input id="regName" class="form-control" required maxlength="80">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regMobile">Mobile</label>
          <input id="regMobile" class="form-control" required pattern="\d{10}" maxlength="10" inputmode="numeric" placeholder="10-digit mobile">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPasswordConfirm">Confirm password</label>
          <input type="password" id="regPasswordConfirm" class="form-control" required minlength="6">
        </div>
        <button class="btn btn-turf w-100" type="submit">Create account</button>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
