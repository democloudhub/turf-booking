<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account — Turf Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-turf">
    <div class="container">
      <a class="navbar-brand display-font" href="/" data-venue-name>GreenField Turf</a>
      <div class="d-flex gap-3 align-items-center" data-auth-nav></div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <h1 class="section-title" id="pageTitle">My Booking</h1>
      <p class="section-lead" id="pageLead">Your bookings with live status.</p>
      <div id="alertBox"></div>

      <ul class="nav nav-pills account-tabs mb-4 gap-2">
        <li class="nav-item"><a class="nav-link" href="/account?tab=bookings" data-account-tab="bookings">My Booking</a>
        </li>
        <li class="nav-item"><a class="nav-link" href="/account?tab=profile" data-account-tab="profile">Profile</a></li>

      </ul>

      <section id="tab-bookings" hidden>
        <div class="form-panel p-0 overflow-hidden">
          <div class="table-responsive">
            <table class="table table-turf mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Date</th>
                  <th>Slot</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="bookingsBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="tab-profile" hidden>
<div class="row">
        <div class="col-lg-6">
          <form id="profileForm" class="form-panel h-100" >
            <div class="mb-3">
              <label class="form-label" for="name">Name</label>
              <input id="name" name="name" class="form-control" required maxlength="80">
            </div>
            <div class="mb-3">
              <label class="form-label" for="mobile">Mobile</label>
              <input id="mobile" name="mobile" class="form-control" required pattern="\d{10}" maxlength="10"
                inputmode="numeric" placeholder="10-digit mobile">
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" class="form-control" disabled>
            </div>
            <button class="btn btn-turf" type="submit">Save profile</button>
          </form>

        </div>
        <div class="col-lg-6">

          <form id="passwordForm" class="form-panel h-100">
            <div class="mb-3">
              <label class="form-label" for="currentPassword">Current password</label>
              <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="newPassword">New password</label>
              <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <input type="password" id="confirmPassword" class="form-control" required minlength="6">
            </div>
            <button class="btn btn-turf" type="submit">Update password</button>
          </form>
        </div>
      </div>
      </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/account.js"></script>
</body>

</html>
