<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Slot — Turf Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-turf">
    <div class="container">
      <a class="navbar-brand display-font" href="/" data-venue-name>GreenField Turf</a>
      <div class="d-flex gap-3 align-items-center" data-auth-nav></div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Book Your Slot</h1>
      <p class="section-lead">Enter your details, choose a date and available hour, then confirm.</p>

      <div id="alertBox"></div>

      <form id="bookingForm" class="form-panel">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Name</label>
            <input id="name" name="name" class="form-control" required maxlength="80">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="mobile">Mobile Number</label>
            <input id="mobile" name="mobile" class="form-control" required pattern="\d{10}" maxlength="10" inputmode="numeric" placeholder="10-digit mobile">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="bookingDate">Date</label>
            <input id="bookingDate" name="bookingDate" type="date" class="form-control" required>
          </div>
          <div class="col-12">
            <label class="form-label">Select Slot</label>
            <div id="slotGrid" class="slot-grid"></div>
            <input type="hidden" id="slotStart" name="slotStart" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Total Amount</label>
            <div class="fs-4 fw-bold text-success" id="totalAmount">—</div>
            <div class="small text-muted" id="priceLabel"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" class="form-control" rows="2" maxlength="300"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-turf" id="submitBtn">Confirm Booking</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/booking.js"></script>
</body>
</html>
